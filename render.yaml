services:
  - type: web
    name: pompilios-barber-club
    runtime: static
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_STYLE_ADVISOR_API_URL
        fromService:
          type: web
          name: pompilios-style-advisor-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: pompilios-style-advisor-api
    runtime: node
    branch: main
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: STYLE_ADVISOR_ALLOWED_ORIGINS
        fromService:
          type: web
          name: pompilios-barber-club
          envVarKey: RENDER_EXTERNAL_URL
